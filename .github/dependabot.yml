version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "advisense-team"
    labels:
      - "dependencies"
    versioning-strategy: increase-if-necessary

    # Security updates
    allow:
      - dependency-type: "all"

    # Group patch updates
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"

      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
