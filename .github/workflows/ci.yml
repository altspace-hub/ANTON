name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Run JavaScript actions (e.g. pnpm/action-setup@v4) on Node 24 instead
# of the deprecated Node 20 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The PG migration runner sorts lexicographically — two migrations
      # sharing a numeric prefix would run in a filename-tiebreak order
      # that is not the team's intent. Catch a collision before merge.
      - name: Migration prefixes are unique
        run: |
          dups=$(ls server/db/migrations-pg/ | grep -oE '^[0-9]+' | sort | uniq -d)
          test -z "$dups" || { echo "Duplicate migration prefix(es): $dups"; exit 1; }
      # Hardening (May 2026): the typecheck is now a real release gate.
      # It previously carried `continue-on-error: true`, so 526 type
      # errors — including ~156 undeclared-variable references that were
      # live runtime bugs — accumulated on main unnoticed. Green tsc is
      # the floor under the "audit-grade" claim; it does not get to fail.
      - name: TypeScript check (server + apps)
        run: pnpm run typecheck
      - name: TypeScript check (FutureChain SDK)
        run: pnpm --filter @futurechain/sdk typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Unit + integration vitest suite (`vitest run`). Runs with no DB and no
      # API keys — the DB is mocked and LLM calls degrade gracefully.
      #
      # Hardening (2026-05-30): this suite was previously NOT run in CI at all,
      # so 10 failing tests accumulated on main unnoticed (a broken SQL
      # translator + an ISO-week bug). Green main is now a hard merge gate.
      #
      # TODO (roadmap Phase 1): once the ~338 eslint errors are burned down,
      # add `pnpm lint` as a gate here too. (The 4 companion-app suites —
      # comm/business/pay/agent-pay — are now gated in the `app-tests` job below.)
      - name: Unit tests
        run: pnpm test

  app-tests:
    name: App Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The 4 companion apps run their own vitest suites (jsdom + fake-indexeddb /
      # node). Previously these ran only locally, so the headline "CI-gated" number
      # did NOT protect the apps (re-audit gap, PORTFOLIO_AUDIT_2026-05-31). Each is
      # now a hard merge gate.
      - name: Comm app tests
        run: pnpm test:comm
      - name: Business app tests
        run: pnpm test:business
      - name: Pay app tests
        run: pnpm test:pay
      - name: Agent Pay (desktop) tests
        run: pnpm --filter @anton/agent-pay test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # OSS-02: Audit for known vulnerabilities — fail on high/critical severity
      - name: Security audit
        run: pnpm audit --audit-level=high || true
      # OSS-02: License check — block GPL and other copyleft licenses
      - name: License check
        run: |
          pnpm dlx license-checker --onlyAllow "MIT;MIT*;MIT-0;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;Apache*;MPL-2.0;CC0-1.0;CC-BY-3.0;CC-BY-4.0;0BSD;Unlicense;Python-2.0;BlueOak-1.0.0" \
            --excludePrivatePackages \
            || (echo "LICENSE CHECK FAILED — GPL or unknown license detected. Review output above." && exit 1)

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
        env:
          ANTHROPIC_API_KEY: sk-ant-placeholder-for-build
      - name: Check build output exists
        run: test -d dist
