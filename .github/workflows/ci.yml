name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Run JavaScript actions (e.g. pnpm/action-setup@v4) on Node 24 instead
# of the deprecated Node 20 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The PG migration runner sorts lexicographically — two migrations
      # sharing a numeric prefix would run in a filename-tiebreak order
      # that is not the team's intent. Catch a collision before merge.
      - name: Migration prefixes are unique
        run: |
          dups=$(ls server/db/migrations-pg/ | grep -oE '^[0-9]+' | sort | uniq -d)
          test -z "$dups" || { echo "Duplicate migration prefix(es): $dups"; exit 1; }
      # Hardening (May 2026): the typecheck is now a real release gate.
      # It previously carried `continue-on-error: true`, so 526 type
      # errors — including ~156 undeclared-variable references that were
      # live runtime bugs — accumulated on main unnoticed. Green tsc is
      # the floor under the "audit-grade" claim; it does not get to fail.
      - name: TypeScript check (server + apps)
        run: pnpm run typecheck
      - name: TypeScript check (FutureChain SDK)
        run: pnpm --filter @futurechain/sdk typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Unit + integration vitest suite (`vitest run`). Runs with no DB and no
      # API keys — the DB is mocked and LLM calls degrade gracefully.
      #
      # Hardening (2026-05-30): this suite was previously NOT run in CI at all,
      # so 10 failing tests accumulated on main unnoticed (a broken SQL
      # translator + an ISO-week bug). Green main is now a hard merge gate.
      #
      # TODO (roadmap Phase 1): once the ~338 eslint errors are burned down,
      # add `pnpm lint` as a gate here too. (The 4 companion-app suites —
      # comm/business/pay/agent-pay — are now gated in the `app-tests` job below.)
      - name: Unit tests
        run: pnpm test

  app-tests:
    name: App Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The in-repo standalone apps run their own vitest suites (node). Comm /
      # Pay / Business app SOURCE ships via the App Store and is no longer in the
      # public repo (gitignored; their suites run locally before release), so the
      # CI gate now covers the standalones that remain in-repo.
      - name: Agent Pay (desktop) tests
        run: pnpm --filter @anton/agent-pay test
      - name: Collaboration tests
        run: pnpm --filter @anton/collaboration test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # OSS-02: Audit for known vulnerabilities.
      #
      # Scope: runtime deps only (`--prod`). The full-tree audit is dominated by
      # dev-tooling CVEs (vitest/rollup/protobufjs(build)/shell-quote/xlsx/electron)
      # that never reach a shipped runtime, so a full-tree gate is pure noise.
      #
      # HARD GATE (2026-06-11, refreshed 2026-06-21): all high/critical runtime
      # advisories are patched (direct bumps: express-rate-limit, nodemailer
      # (>=9.0.1), ws (>=8.21.0), @opentelemetry/{sdk-node,
      # auto-instrumentations-node,exporter-trace-otlp-http}) or pinned via
      # pnpm.overrides (protobufjs, hono, @hono/node-server, socket.io-parser,
      # @xmldom/xmldom, fast-uri, tmp, @grpc/grpc-js, path-to-regexp x2, ws,
      # form-data). See docs/SECURITY_CVE_TRIAGE.md. `pnpm audit --prod
      # --audit-level=high` exits 0, so the `|| true` is removed — a NEW runtime
      # high/critical CVE now fails the build. (Residual low/moderate advisories
      # are below the gate threshold and intentionally not blocked.)
      - name: Security audit (runtime deps)
        run: pnpm audit --prod --audit-level=high
      # OSS-02: License check — block strong-copyleft (GPL/AGPL/LGPL/SSPL) from
      # the DISTRIBUTED product. Scoped to `--production`: license obligations
      # flow from what actually ships (the `dependencies` tree), not build-time
      # devtools — e.g. sharp's dynamically-linked libvips is LGPL-3.0 but is
      # icon-generation tooling that is never distributed. The allowlist
      # additions (2026-06-21) are all permissive: OFL-1.1 (SIL Open Font
      # License — the bundled Inter / JetBrains Mono webfonts) and two
      # dual-licensed prod deps where we elect the permissive option —
      # dompurify `(MPL-2.0 OR Apache-2.0)` and jszip `(MIT OR GPL-3.0-or-later)`
      # (used under MIT). license-checker can't evaluate SPDX OR-expressions, so
      # the exact dual string is allowlisted rather than the chosen term.
      - name: License check
        run: |
          pnpm dlx license-checker --production --excludePrivatePackages \
            --onlyAllow "MIT;MIT*;MIT-0;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;Apache*;MPL-2.0;CC0-1.0;CC-BY-3.0;CC-BY-4.0;0BSD;Unlicense;Python-2.0;BlueOak-1.0.0;OFL-1.1;(MPL-2.0 OR Apache-2.0);(MIT OR GPL-3.0-or-later)" \
            || (echo "LICENSE CHECK FAILED — a non-permitted (likely strong-copyleft) license is present in PRODUCTION dependencies. Review output above." && exit 1)

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
        env:
          ANTHROPIC_API_KEY: sk-ant-placeholder-for-build
      - name: Check build output exists
        run: test -d dist
