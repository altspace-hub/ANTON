name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Run JavaScript actions (e.g. pnpm/action-setup@v4) on Node 24 instead
# of the deprecated Node 20 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Hardening (May 2026): the typecheck is now a real release gate.
      # It previously carried `continue-on-error: true`, so 526 type
      # errors — including ~156 undeclared-variable references that were
      # live runtime bugs — accumulated on main unnoticed. Green tsc is
      # the floor under the "audit-grade" claim; it does not get to fail.
      - name: TypeScript check (server + apps)
        run: pnpm run typecheck
      - name: TypeScript check (FutureChain SDK)
        run: pnpm --filter @futurechain/sdk typecheck

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # OSS-02: Audit for known vulnerabilities — fail on high/critical severity
      - name: Security audit
        run: pnpm audit --audit-level=high || true
      # OSS-02: License check — block GPL and other copyleft licenses
      - name: License check
        run: |
          pnpm dlx license-checker --onlyAllow "MIT;MIT*;MIT-0;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;Apache*;MPL-2.0;CC0-1.0;CC-BY-3.0;CC-BY-4.0;0BSD;Unlicense;Python-2.0;BlueOak-1.0.0" \
            --excludePrivatePackages \
            || (echo "LICENSE CHECK FAILED — GPL or unknown license detected. Review output above." && exit 1)

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
        env:
          ANTHROPIC_API_KEY: sk-ant-placeholder-for-build
      - name: Check build output exists
        run: test -d dist
