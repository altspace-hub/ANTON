name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday 2am

# Run JavaScript actions (e.g. pnpm/action-setup@v4) on Node 24 instead
# of the deprecated Node 20 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runtime-dep audit — HARD GATE (2026-06-11). All high/critical runtime
      # advisories are patched (direct bumps + pnpm.overrides; see
      # docs/SECURITY_CVE_TRIAGE.md). `pnpm audit --prod --audit-level=high`
      # exits 0, so continue-on-error is removed: a NEW runtime high/critical
      # CVE now fails this job. Residual low/moderate advisories are below the
      # gate threshold and intentionally not blocked.
      - name: Run security audit (runtime deps)
        run: pnpm audit --prod --audit-level=high

      - name: Generate vulnerability report
        run: node scripts/vulnerability-report.js
        continue-on-error: true

      - name: Check licenses
        run: node scripts/generate-license-report.js
        continue-on-error: true

      - name: Upload reports
        uses: actions/upload-artifact@v5
        with:
          name: security-reports
          path: |
            vulnerability-report.json
            LICENSES.csv

  # ── Secret scanning ─────────────────────────────────────────────────────────
  # gitleaks scans the repo (and full history on push) for committed secrets.
  gitleaks:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so gitleaks can scan past commits, not just the tip.
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Static analysis (SAST) ──────────────────────────────────────────────────
  # CodeQL semantic analysis for JavaScript/TypeScript.
  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
