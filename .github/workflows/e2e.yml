name: E2E Cross-Browser Tests

# TEST-07: Nightly cross-browser matrix — Chrome, Firefox, WebKit
# Also runs on push to main (smoke test) but only Chromium to keep it fast.
on:
  schedule:
    # Nightly at 02:00 UTC
    - cron: '0 2 * * *'
  push:
    branches: [main]
  workflow_dispatch:

# Run JavaScript actions (e.g. pnpm/action-setup@v4) on Node 24 instead
# of the deprecated Node 20 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    name: E2E — ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    # ANTON is PostgreSQL-ONLY. Without DATABASE_URL the server now refuses to
    # boot (it used to silently fall back to legacy SQLite and crash on the
    # first query — `no such table: entity_nodes`). Provide a real Postgres so
    # E2E runs against the same engine production uses.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anton
          POSTGRES_PASSWORD: anton
          POSTGRES_DB: anton
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anton -d anton"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://anton:anton@localhost:5432/anton
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Use `pnpm exec` (the repo-pinned @playwright/test, currently 1.58.2), NOT
      # `pnpm dlx` (which resolves the LATEST playwright from npm and installs
      # browser builds whose version doesn't match the pinned test runner → the
      # runner then fails with "browserType.launch: Executable doesn't exist").
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.project }}

      - name: Build app
        run: pnpm run build
        env:
          ANTHROPIC_API_KEY: sk-ant-placeholder-for-build

      - name: Initialize PostgreSQL schema
        run: pnpm run db:init

      - name: Run PostgreSQL migrations
        run: pnpm run db:migrate:pg

      - name: Start server and run E2E tests
        run: |
          # Start the production server in background (tsx runs TypeScript directly).
          # DATABASE_URL is inherited from the job env → real PostgreSQL.
          ANTHROPIC_API_KEY=sk-ant-placeholder PORT=5173 DEPLOYMENT_MODE=solo JWT_SECRET=ci-test-secret-not-real pnpm tsx server/index.ts &
          SERVER_PID=$!
          # Wait for server to be ready
          npx wait-on http://localhost:5173 --timeout 30000
          # Run E2E tests against this project
          pnpm test:e2e --project=${{ matrix.project }}
          # Cleanup
          kill $SERVER_PID || true
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-results-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
