apply plugin: 'com.android.application'

// Load release-signing config from keystore.properties (gitignored).
// Hoisted to project scope 2026-09-06: the release guard at the bottom of this
// file needs `hasKeystore` and `keystorePropertiesFile`, and loading them inside
// signingConfigs.release left both undefined — the guard threw
// "Could not get unknown property 'hasKeystore'" and NO release build of this
// app could be produced at all.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.futurechain.anton.companion"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.futurechain.anton.companion"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasKeystore) {
            release {
                // NB: resolved against the APP MODULE dir, not rootProject. These two apps keep
                // their keystore inside android*/ (so '../x.keystore' means android*/x.keystore),
                // whereas pay/comm/business keep theirs at the repo root. Using rootProject.file
                // here silently pointed one directory too high and failed validateSigningRelease.
                storeFile file(keystoreProperties['storeFile'] as String)
                storePassword keystoreProperties['storePassword'] as String
                keyAlias keystoreProperties['keyAlias'] as String
                keyPassword keystoreProperties['keyPassword'] as String
            }
        }
    }
    buildTypes {
        release {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            // ANM7: tighten release block — disable debuggable, drop unused
            // resources alongside R8's code shrinking. Without these the
            // released APK ships ~30% larger and is debuggable on prod
            // devices.
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
// ─── release guards (added 2026-09-05) ──────────────────────────────────────
// `signingConfig` above is applied only `if (hasKeystore)`. Without this check
// a release build on a machine with no keystore.properties still SUCCEEDS and
// writes an UNSIGNED artifact to the usual output path — which is exactly the
// file a tired operator uploads. Fail at configuration time instead.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { t ->
        t.project == project && t.name.toLowerCase().contains('release') &&
        (t.name.startsWith('assemble') || t.name.startsWith('bundle'))
    }
    if (!wantsRelease) return
    if (!hasKeystore) {
        throw new GradleException(
            "Release build requested but ${keystorePropertiesFile} is missing.\n" +
            "  An unsigned release artifact cannot be uploaded to Play and must never\n" +
            "  be shipped. Copy keystore.properties.example, fill it in, and retry.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
