# ANTON Mesh Relay — minimal docker-compose for self-hosters.
#
# Variations:
#   1. Behind a reverse proxy (Caddy / nginx / Cloudflare) that handles TLS:
#        Set RELAY_INSECURE=1, omit cert mount, expose port behind proxy.
#   2. Direct TLS termination at the relay:
#        Mount cert + key, set RELAY_TLS_CERT / RELAY_TLS_KEY paths.
#
# Edit the .env file (not committed) for secrets and overrides.

services:
  relay:
    build: .
    image: anton-mesh-relay:0.2.0
    container_name: anton-mesh-relay
    restart: unless-stopped
    depends_on:
      registry-db:
        condition: service_healthy
        required: false
    environment:
      # REQUIRED — canonical URL phones use to dial this relay.
      # Mesh handshakes verify this matches; mismatch = MAC_FAIL.
      RELAY_URL: ${RELAY_URL:?required}
      RELAY_PORT: ${RELAY_PORT:-8443}
      RELAY_HOST: 0.0.0.0
      # Set to 1 if a reverse proxy in front handles TLS.
      RELAY_INSECURE: ${RELAY_INSECURE:-}
      # Direct-TLS mode: paths INSIDE the container.
      RELAY_TLS_CERT: ${RELAY_TLS_CERT:-}
      RELAY_TLS_KEY: ${RELAY_TLS_KEY:-}
      # Per-instance concurrent-session ceiling (spec §3.10).
      RELAY_MAX_SESSIONS_PER_INSTANCE: ${RELAY_MAX_SESSIONS_PER_INSTANCE:-32}
      # Audit log destination (path inside container or stdout).
      RELAY_AUDIT_LOG_PATH: ${RELAY_AUDIT_LOG_PATH:-}
      # ── Portal registry (v0.2+) ────────────────────────────────────
      # All three together enable /v1/portals/*. Leave unset to keep
      # the relay WS-only — /v1/* will respond 503.
      RELAY_REGISTRY_DATABASE_URL: ${RELAY_REGISTRY_DATABASE_URL:-}
      RELAY_OPERATOR_PASSWORD: ${RELAY_OPERATOR_PASSWORD:-}
      RELAY_OPERATOR_JWT_SECRET: ${RELAY_OPERATOR_JWT_SECRET:-}
      # ── Comm FCM wake push (Phase 3) ───────────────────────────────
      # Content-free push that wakes a backgrounded/killed Comm app when a
      # message is mailboxed. Needs the registry DB above (token store) +
      # a Firebase service-account key. Unset → wake pushes are a no-op.
      # See docs/FCM_OPERATOR_RUNBOOK.md.
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}  # path to / inline service-account JSON
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}                      # optional; defaults to the key's project_id
    ports:
      - "${RELAY_PORT:-8443}:${RELAY_PORT:-8443}"
    volumes:
      # Mount certs read-only when running direct-TLS mode.
      - ${RELAY_CERT_DIR:-/dev/null}:/certs:ro
      # Persist audit log if RELAY_AUDIT_LOG_PATH points inside this dir.
      - ./audit:/app/audit
    # Read-only root filesystem — defense-in-depth. The container has no
    # reason to write anywhere except the explicitly-mounted audit volume.
    read_only: true
    # tmpfs for any process scratch space (Node module load, /tmp).
    tmpfs:
      - /tmp:size=64M
    # Bound resources so a malicious peer cannot exhaust the host.
    mem_limit: 512m
    cpus: 1.0
    # Default capabilities are dropped except for what's strictly needed.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ── Postgres for the portal registry (v0.2+) ──────────────────────
  #
  # Optional: only used when RELAY_REGISTRY_DATABASE_URL is set AND
  # points at this service (recommended URL:
  #   postgresql://relay:${POSTGRES_PASSWORD}@registry-db:5432/relay_registry
  # ).
  #
  # If you already run Postgres elsewhere (managed service, separate
  # box, etc.), comment this whole service out and point
  # RELAY_REGISTRY_DATABASE_URL at the external host. The relay needs
  # superuser-level perms only for the initial CREATE EXTENSION
  # pgcrypto in migration 001 — after that, a least-privileged
  # role is enough.
  registry-db:
    image: postgres:16-alpine
    container_name: anton-relay-registry-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required when using bundled DB}
      POSTGRES_DB: ${POSTGRES_DB:-relay_registry}
    volumes:
      - registry-db-data:/var/lib/postgresql/data
    # Bind only to localhost on the host so the DB is not exposed to
    # the public internet — only the relay container reaches it on
    # the docker-compose network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relay} -d ${POSTGRES_DB:-relay_registry}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

volumes:
  registry-db-data:
