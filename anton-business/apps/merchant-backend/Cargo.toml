[package]
name = "merchant-backend"
version = "0.0.1"
edition = "2021"
description = "ANTON Business merchant backend — settlement orchestration, email kvitto, KYB lookup."
license = "UNLICENSED"
publish = false

[features]
default = ["server"]
# `server` pulls in axum + sqlx + tokio runtime. Disable for fast unit
# tests of pure modules (reference, delegation, wallet) via:
#   cargo test --lib --no-default-features --features test-pure
server = [
  "dep:axum", "dep:tower", "dep:tower-http", "dep:sqlx",
  "dep:reqwest", "dep:dotenvy", "dep:tracing-subscriber",
  "tokio/full",
]
test-pure = []

[lib]
name = "merchant_backend"
path = "src/lib.rs"

[[bin]]
name = "merchant-backend"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
# ── Always-on: pure-logic deps used by reference/delegation/wallet ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secp256k1 = { version = "0.30", features = ["recovery"] }
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "2"
anyhow = "1"
# Used as a typed runtime by both server and non-server code; keep
# non-optional but feature-gate the `full` set behind `server`.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

# ── Optional: HTTP server stack ─────────────────────────────────────
axum = { version = "0.7", features = ["macros"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout"], optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono", "bigdecimal"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
dotenvy = { version = "0.15", optional = true }

[dev-dependencies]
insta = { version = "1", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
