name: openexpert

services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PORT=3001
      - DB_PATH=/app/data/workbench.sqlite
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - MAX_FILE_SIZE_MB=50
      - MAX_CONTEXT_TOKENS=180000
      - DEFAULT_MODEL=claude-opus-4-6
      # Optional: restrict CORS if you add network access
      # - CORS_ORIGINS=http://localhost:3001
    volumes:
      - openexpert_data:/app/data
      - openexpert_uploads:/app/uploads
      - openexpert_outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  openexpert_data:
  openexpert_uploads:
  openexpert_outputs:
